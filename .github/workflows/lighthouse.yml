name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder, not the production database. Every audited route is
          # unauthenticated and reads no data; passing secrets.DATABASE_URL into
          # a pull_request-triggered job pointed a CI-controlled Next server at
          # the live database on every PR.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-lighthouse-secret-at-least-32-chars
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-lighthouse-secret-at-least-32-chars
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || '' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || '' }}

      - name: Start server
        run: npm start &
        env:
          PORT: 3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-lighthouse-secret-at-least-32-chars
          NEXTAUTH_SECRET: ci-lighthouse-secret-at-least-32-chars
          NEXTAUTH_URL: http://localhost:3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        # 0.14.x bundles Lighthouse 11, whose trace parser throws on current
        # Chrome ("Cannot read properties of undefined (reading
        # 'frame_sequence')") — the job could only have gone green on an old
        # runner image.
        run: npx @lhci/cli@0.15.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
