version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep the framework family in one PR — Next, React and the ESLint config
      # are version-coupled and land together or not at all.
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
